opt_in_rules:
  - nesting
  - line_length
  - trailing_whitespace
  - type_name
  - identifier_name
  - redundant_void_return
  - implicit_getter
  - indentation_width
  - force_cast
  - force_try
  - force_unwrapping
  - vertical_whitespace

disabled_rules:
  - statement_position
  - colon
  - empty_parentheses_with_trailing_closure
  
indentation_width:
  indentation_width: 2
  include_comments: true
  include_compiler_directives: true
  include_multiline_strings: true

nesting:
  type_level: 2
  check_nesting_in_closures_and_statements: true

line_length:
  warning: 100

trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: true

type_name:
  min_length: 2

identifier_name:
  min_length: 3
  validates_start_with_lowercase: true
